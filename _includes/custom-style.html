<style>
/* AI Research Tracker - Custom CSS */

/* Color Variables */
:root {
  --primary-gradient-start: #2563eb;
  --primary-gradient-end: #1e40af;
  --accent-color: #06b6d4;
  --success-color: #10b981;
  --warning-color: #f59e0b;
  --danger-color: #ef4444;
  --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
  --card-hover-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
  --border-radius: 12px;
  --transition-speed: 0.3s;
}

/* Hero Section */
.hero-section {
  background: linear-gradient(135deg, var(--primary-gradient-start) 0%, var(--primary-gradient-end) 100%);
  color: white;
  padding: 4rem 2rem;
  border-radius: var(--border-radius);
  margin-bottom: 2rem;
  position: relative;
  overflow: hidden;
}

.hero-section::before {
  content: '';
  position: absolute;
  top: -50%;
  right: -50%;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
  animation: pulse 8s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

.hero-section h1 {
  font-size: 3rem;
  font-weight: 800;
  margin-bottom: 1rem;
  position: relative;
  z-index: 1;
}

.hero-section p {
  font-size: 1.25rem;
  opacity: 0.95;
  position: relative;
  z-index: 1;
}

/* Card Enhancements */
.card {
  border: none;
  border-radius: var(--border-radius);
  box-shadow: var(--card-shadow);
  transition: all var(--transition-speed) ease;
  overflow: hidden;
}

.card:hover {
  transform: translateY(-4px);
  box-shadow: var(--card-hover-shadow);
}

.card-header {
  background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
  border-bottom: 2px solid #e2e8f0;
  font-weight: 600;
  padding: 1rem 1.5rem;
}

/* Navigation Improvements */
.navbar {
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  backdrop-filter: blur(10px);
  background: rgba(255, 255, 255, 0.95) !important;
}

.navbar-brand {
  font-weight: 700;
  font-size: 1.5rem;
  background: linear-gradient(135deg, var(--primary-gradient-start), var(--accent-color));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.nav-link {
  font-weight: 500;
  transition: all var(--transition-speed) ease;
  position: relative;
}

.nav-link::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50%;
  width: 0;
  height: 2px;
  background: var(--primary-gradient-start);
  transition: all var(--transition-speed) ease;
  transform: translateX(-50%);
}

.nav-link:hover::after {
  width: 80%;
}

/* Button Styles */
.btn-primary {
  background: linear-gradient(135deg, var(--primary-gradient-start), var(--primary-gradient-end));
  border: none;
  font-weight: 600;
  padding: 0.75rem 1.5rem;
  border-radius: 8px;
  transition: all var(--transition-speed) ease;
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 16px rgba(37, 99, 235, 0.3);
}

.btn-outline-primary {
  border: 2px solid var(--primary-gradient-start);
  color: var(--primary-gradient-start);
  font-weight: 600;
  padding: 0.75rem 1.5rem;
  border-radius: 8px;
  transition: all var(--transition-speed) ease;
}

.btn-outline-primary:hover {
  background: var(--primary-gradient-start);
  color: white;
  transform: translateY(-2px);
}

/* Tag Cloud Styling */
.tag-badge {
  display: inline-block;
  padding: 0.5rem 1rem;
  margin: 0.25rem;
  border-radius: 20px;
  background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
  color: #0369a1;
  font-weight: 500;
  font-size: 0.875rem;
  transition: all var(--transition-speed) ease;
  cursor: pointer;
  border: 1px solid #7dd3fc;
}

.tag-badge:hover {
  background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
  color: white;
  transform: scale(1.05);
}

/* Paper Card Styling */
.paper-card {
  position: relative;
  border-left: 4px solid var(--primary-gradient-start);
}

/* Statistics Cards */
.stat-card {
  background: white;
  border-radius: var(--border-radius);
  padding: 1.5rem;
  text-align: center;
  box-shadow: var(--card-shadow);
  transition: all var(--transition-speed) ease;
}

.stat-number {
  font-size: 2.5rem;
  font-weight: 800;
  background: linear-gradient(135deg, var(--primary-gradient-start), var(--accent-color));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.stat-label {
  color: #64748b;
  font-weight: 500;
  margin-top: 0.5rem;
}

/* Sidebar Improvements */
.sidebar {
  background: #f8fafc;
  border-radius: var(--border-radius);
  padding: 1rem;
  box-shadow: var(--card-shadow);
}

.sidebar .nav-link {
  border-radius: 8px;
  margin-bottom: 0.25rem;
  padding: 0.75rem 1rem;
}

.sidebar .nav-link:hover,
.sidebar .nav-link.active {
  background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
  color: var(--primary-gradient-start);
  font-weight: 600;
}

/* Table Enhancements */
.table {
  border-radius: var(--border-radius);
  overflow: hidden;
  box-shadow: var(--card-shadow);
}

.table thead {
  background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
}

.table thead th {
  font-weight: 600;
  text-transform: uppercase;
  font-size: 0.75rem;
  letter-spacing: 0.05em;
  color: #475569;
  border: none;
  padding: 1rem;
}

.table tbody tr {
  transition: all var(--transition-speed) ease;
}

.table tbody tr:hover {
  background: #f8fafc;
  transform: scale(1.01);
}

/* Search Box */
.searchbox {
  border-radius: 24px;
  border: 2px solid #e2e8f0;
  padding: 0.75rem 1.5rem;
  font-size: 1rem;
  transition: all var(--transition-speed) ease;
  width: 100%;
}

.searchbox:focus {
  border-color: var(--primary-gradient-start);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
  outline: none;
}

/* Footer */
.footer {
  background: #f8fafc;
  padding: 2rem;
  margin-top: 3rem;
  border-top: 2px solid #e2e8f0;
  text-align: center;
  color: #64748b;
}

/* Responsive Improvements */
@media (max-width: 768px) {
  .hero-section h1 {
    font-size: 2rem;
  }
  
  .stat-number {
    font-size: 2rem;
  }
  
  .navbar {
    padding: 0.5rem;
  }
}

/* Dark Mode */
[data-theme="dark"] {
  --bg-color: #1a1a2e;
  --card-bg: #16213e;
  --text-color: #e0e0e0;
  --text-muted: #a0a0a0;
  --border-color: #2a2a4a;
  --primary-gradient-start: #4a90e2;
  --primary-gradient-end: #357abd;
  --accent-color: #00d4ff;
}

[data-theme="dark"] body {
  background: var(--bg-color);
  color: var(--text-color);
}

[data-theme="dark"] .card {
  background: var(--card-bg);
  border-color: var(--border-color);
}

[data-theme="dark"] .navbar {
  background: var(--card-bg) !important;
  border-bottom: 1px solid var(--border-color);
}

[data-theme="dark"] .navbar-light .navbar-nav .nav-link {
  color: var(--text-color) !important;
}

[data-theme="dark"] .text-muted {
  color: var(--text-muted) !important;
}

[data-theme="dark"] .hero-section {
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
}

[data-theme="dark"] .hero-section::before {
  background: radial-gradient(circle at 50% 50%, rgba(74, 144, 226, 0.1) 0%, transparent 70%);
}

/* Theme Toggle Button */
.theme-toggle {
  position: fixed;
  top: 80px;
  right: 20px;
  z-index: 1000;
  background: var(--primary-gradient-start);
  color: white;
  border: none;
  border-radius: 50%;
  width: 50px;
  height: 50px;
  cursor: pointer;
  box-shadow: var(--card-shadow);
  transition: all var(--transition-speed);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
}

.theme-toggle:hover {
  transform: scale(1.1) rotate(180deg);
  box-shadow: var(--card-hover-shadow);
}

/* Recent Papers Widget */
.recent-papers-widget {
  background: var(--card-bg);
  border-radius: var(--border-radius);
  padding: 1.5rem;
  margin: 2rem 0;
  box-shadow: var(--card-shadow);
}

.recent-papers-widget h3 {
  margin-bottom: 1rem;
  color: var(--primary-gradient-start);
  font-weight: 700;
}

.recent-paper-item {
  padding: 0.75rem;
  border-bottom: 1px solid var(--border-color);
  transition: all var(--transition-speed);
}

.recent-paper-item:last-child {
  border-bottom: none;
}

.recent-paper-item:hover {
  background: rgba(37, 99, 235, 0.05);
  padding-left: 1rem;
}

.recent-paper-title {
  font-weight: 600;
  color: var(--text-color);
  margin-bottom: 0.25rem;
}

.recent-paper-meta {
  font-size: 0.85rem;
  color: var(--text-muted);
}

/* Enhanced Paper Cards */
.paper-card-enhanced {
  position: relative;
  overflow: hidden;
}

.paper-card-enhanced::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 4px;
  height: 100%;
  background: linear-gradient(180deg, var(--primary-gradient-start), var(--primary-gradient-end));
  transform: scaleY(0);
  transition: transform var(--transition-speed);
}

.paper-card-enhanced:hover::before {
  transform: scaleY(1);
}

.paper-card-meta {
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
  margin-top: 0.75rem;
  font-size: 0.85rem;
  color: var(--text-muted);
}

.paper-card-meta-item {
  display: flex;
  align-items: center;
  gap: 0.25rem;
}

.paper-card-tags {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
  margin-top: 0.75rem;
}

.paper-tag {
  background: linear-gradient(135deg, var(--primary-gradient-start), var(--primary-gradient-end));
  color: white;
  padding: 0.25rem 0.75rem;
  border-radius: 16px;
  font-size: 0.75rem;
  font-weight: 500;
  transition: all var(--transition-speed);
}

.paper-tag:hover {
  transform: scale(1.05);
  box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
}

/* Accessibility */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

</style>
